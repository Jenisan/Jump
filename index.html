<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#1b1d3a">
<title>Jump</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Oswald:wght@500;600;700&family=Lilita+One&family=Nunito:wght@700;800;900&display=swap">
<style>
/* Full-bleed canvas side-scroller; HTML overlay for menus; on-screen pads on phones and tablets only. */
:root{
  --ink:#141210; --paper:#f1e9df; --sun:#ffb03a; --tang:#ff6a1a; --leaf:#5fd068; --sky:#4fc3ff; --berry:#ff4f7b; --plum:#7b5cff;
  --dim:rgba(241,233,223,.78); --rule:rgba(241,233,223,.22); --veil:rgba(14,12,10,.78);
  --display:'Black Ops One','Arial Black',sans-serif; --ui:'Oswald','Arial Narrow',Arial,sans-serif; color-scheme:dark;
}
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:var(--ink);color:var(--paper);font-family:var(--ui)}
body{-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
#game{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--veil);
  padding:max(12px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(12px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
#ov.title{background:linear-gradient(to top,rgba(14,12,10,.92),rgba(14,12,10,.5) 38%,rgba(14,12,10,0) 62%);align-items:flex-end}
#ov.clear{background:rgba(14,12,10,.55)}
#ovIn{max-width:640px;width:100%;max-height:100%;overflow:hidden;display:flex;flex-direction:column;gap:12px}
#ovIn.wide{max-width:980px}
#ov.title #ovIn{align-items:center;text-align:center;margin-bottom:2vh;max-width:900px}
#ov.title .acts,#ov.title .keys,#ov.title .stats{justify-content:center}
.eyebrow{font-weight:900;letter-spacing:.22em;font-size:14px;text-transform:uppercase;color:var(--sun)}
h1{font-family:var(--display);font-weight:400;font-size:clamp(76px,15vw,170px);line-height:.95;margin:0;letter-spacing:.04em;filter:drop-shadow(0 5px 0 #2a120a) drop-shadow(0 0 18px rgba(255,106,26,.45))}
h1 span{background:linear-gradient(180deg,#f3eee6 0%,#bdb4aa 40%,#857a70 52%,#a9562a 78%,#ff7a2a 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
h1 span{display:inline-block;animation:hop 1.6s ease-in-out infinite}
h1 span:nth-child(2){animation-delay:.12s} h1 span:nth-child(3){animation-delay:.24s} h1 span:nth-child(4){animation-delay:.36s} h1 span:nth-child(5){animation-delay:.48s;color:#ff7a2a;background:none}
@keyframes hop{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-8%)}}
@media (prefers-reduced-motion:reduce){h1 span{animation:none}}
h2{font-family:var(--display);font-weight:400;font-size:clamp(24px,3.8vw,38px);line-height:1.05;margin:0;color:#f1e9df;letter-spacing:.03em;text-shadow:0 0 14px rgba(255,106,26,.45)}
h3.sec{margin:2px 0 0;font:900 14px var(--ui);letter-spacing:.18em;text-transform:uppercase;color:var(--sun)}
p{margin:0;font-size:18px;line-height:1.3;color:var(--dim);max-width:62ch;font-weight:500}
.keys{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:16px;color:var(--dim);font-weight:700}
.keys span{display:inline-flex;align-items:center;gap:5px}
kbd{font-family:var(--ui);font-weight:900;font-size:13px;min-width:22px;padding:0 6px;text-align:center;border:1.5px solid var(--dim);border-radius:5px;color:var(--paper)}
.stats{display:flex;flex-wrap:wrap;gap:4px 22px;font-size:16px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);font-variant-numeric:tabular-nums}
.stats b{color:var(--paper);font-weight:900}
.stats b.gold,.cash{color:var(--sun)}
.acts{display:flex;flex-wrap:wrap;gap:10px;margin-top:4px}
.btn{font-family:var(--ui);font-weight:700;font-size:21px;letter-spacing:.12em;text-transform:uppercase;color:#1a0d04;background:linear-gradient(180deg,#ffc06a,#f07a22 55%,#b4471a);border:0;border-radius:6px;padding:7px 22px 8px;cursor:pointer;box-shadow:0 4px 0 #5e230a,0 0 16px rgba(255,106,26,.4),inset 0 1px 0 rgba(255,255,255,.35)}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 #5e230a}
.btn.ghost{background:linear-gradient(180deg,#5b524b,#3a3430);color:var(--paper);box-shadow:0 4px 0 #1a1614,inset 0 0 0 1.5px rgba(200,140,90,.45)}
.btn.sm{font-size:16px;padding:4px 12px 5px;border-radius:5px}
.btn:disabled{opacity:.38;cursor:default}
.btn:not(:disabled):hover{filter:brightness(1.1)}
button:focus-visible{outline:3px solid var(--sky);outline-offset:3px}
.ver{position:fixed;right:max(12px,env(safe-area-inset-right,0px));bottom:max(8px,env(safe-area-inset-bottom,0px));font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.arcback{position:fixed;left:max(12px,env(safe-area-inset-left,0px));top:max(10px,env(safe-area-inset-top,0px));font:900 15px var(--ui);letter-spacing:.12em;text-transform:uppercase;color:var(--paper);background:rgba(20,21,48,.6);border:0;border-radius:10px;cursor:pointer;padding:7px 12px;z-index:2}
.arcback:hover{color:var(--sun)}
/* Panels (pause, inventory, workshop, run over) */
/* painted frames from the UI sheet (9-slice): the glass screen for panels, the pipe frame for run over, rust plates for cards */
#ovIn.panel{border-style:solid;border-width:34px 30px 40px 30px;border-image:url(ui-panel.webp) 52 46 62 46 fill stretch;padding:4px 10px 6px;filter:drop-shadow(0 12px 26px rgba(0,0,0,.65))}
#ovIn.bad{border-style:solid;border-width:40px 40px 42px 40px;border-image:url(ui-hazard.webp) 62 62 66 62 fill stretch;padding:4px 10px 6px;filter:drop-shadow(0 12px 26px rgba(0,0,0,.65))}
.hbar{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:8px 16px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.grid.four{grid-template-columns:repeat(4,minmax(0,1fr))}
.slotpick{display:flex;align-items:center;gap:4px;margin:4px 0 6px;font:800 11px var(--body,Nunito),sans-serif;color:#d8c8b4;text-transform:uppercase;letter-spacing:.06em}
.slotpick span{margin-right:2px}.slotpick .sp{min-width:24px;height:24px;border-radius:6px;border:1.5px solid rgba(200,140,90,.6);background:rgba(20,16,12,.6);color:#e8d8c4;font:800 12px Nunito,sans-serif;cursor:pointer;padding:0}
.slotpick .sp.on{background:#ff8a2a;border-color:#fff2c0;color:#fff}.slotpick .sp:focus-visible{outline:2px solid #ffd64a}
.card{display:flex;flex-direction:column;gap:4px;border-style:solid;border-width:12px 13px;border-image:url(ui-card.webp) 22 fill stretch;padding:0 2px}
.card.on{border-image:url(ui-card-on.webp) 26 fill stretch}
.card.off{opacity:.45}
.card h3{margin:0;font:700 19px var(--ui);letter-spacing:.08em;text-transform:uppercase;color:#fff;display:flex;align-items:center;gap:8px}
.card h3 canvas{width:26px;height:26px;flex:none}
.card .d{font-size:14px;color:var(--dim);line-height:1.2;flex:1;font-weight:500}
.card .n{font:700 13px var(--ui);letter-spacing:.1em;text-transform:uppercase;color:var(--sun)}
.card .row{display:flex;gap:6px;flex-wrap:wrap}
.pips{letter-spacing:.2em;color:var(--sun)}
.small{font-size:14px}
/* Tools */
#tools{position:fixed;top:max(8px,env(safe-area-inset-top,0px));right:max(10px,env(safe-area-inset-right,0px));display:flex;gap:8px;z-index:3}
.tool{width:40px;height:40px;border-radius:50%;border:2px solid rgba(200,140,90,.5);background:rgba(20,16,12,.6);color:var(--paper);font:900 15px var(--ui);cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
/* Touch pads (phones and tablets only) */
#pads{position:fixed;inset:0;pointer-events:none;z-index:2}
.pad{position:absolute;pointer-events:auto;touch-action:none;width:var(--ps);height:var(--ps);border-radius:50%;border:3px solid rgba(200,140,90,.7);background:rgba(30,24,20,.45);color:#fff;font:400 calc(var(--ps)*.34) var(--display);display:flex;align-items:center;justify-content:center;padding:0;opacity:.85}
.pad.on{opacity:1;background:rgba(255,201,60,.45);border-color:#fff}
.pad.j{width:calc(var(--ps)*1.35);height:calc(var(--ps)*1.35);background:rgba(255,138,61,.42);font-size:calc(var(--ps)*.27)}
.pad.f{background:rgba(255,79,123,.38);font-size:calc(var(--ps)*.26)}
.pad.s,.pad.it,.pad.dn{width:calc(var(--ps)*.7);height:calc(var(--ps)*.7);font-size:calc(var(--ps)*.22)}
#rotate{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;background:var(--ink);font:900 24px var(--ui);letter-spacing:.1em;text-transform:uppercase;padding:24px;z-index:2147483647;touch-action:none}
body.padmode .kb{display:none} body:not(.padmode) .gp{display:none}
@media (max-height:500px){
  h1{font-size:clamp(56px,11vw,100px)} h2{font-size:clamp(19px,3vw,26px)} p{font-size:14px} #ovIn{gap:6px} .btn{font-size:16px;padding:6px 14px 7px} .acts{gap:7px}
  .card{border-width:7px 8px;gap:1px} .card h3{font-size:15px} .card h3 canvas{width:20px;height:20px} .card .d{font-size:12px} .grid{gap:5px} .keys{font-size:13px} .stats{font-size:13px;gap:2px 14px}
  #ov.title .keys,#ov.title #ovIn>p{display:none}
  #ovIn.panel{border-width:20px 18px 24px 18px;padding:0 6px} #ovIn.bad{border-width:24px 24px 26px 24px;padding:0 6px} .eyebrow{font-size:11px} h3.sec{font-size:11px}
}
.vols{display:grid;gap:12px;margin:10px 0 6px;min-width:min(380px,80vw)}
.vol{display:grid;grid-template-columns:8.5em 1fr 3.2em;align-items:center;gap:12px;font-weight:800}
.vol input{width:100%;accent-color:var(--sun)}.vol b{text-align:right;font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="pads" hidden>
  <button class="pad l" type="button" data-k="left" aria-label="Left">◀</button>
  <button class="pad r" type="button" data-k="right" aria-label="Right">▶</button>
  <button class="pad dn" type="button" data-k="down" aria-label="Drop down">▼</button>
  <button class="pad j" type="button" data-k="jump" aria-label="Jump">JUMP</button>
  <button class="pad f" type="button" data-k="fire" aria-label="Fire">FIRE</button>
  <button class="pad s" type="button" data-k="swap" aria-label="Next weapon">⟳</button>
  <button class="pad it" type="button" data-k="item" aria-label="Use item">ITEM</button>
</div>
<div id="tools" hidden><button class="tool" id="bBag" type="button" aria-label="Inventory">🎒</button><button class="tool" id="bSnd" type="button" aria-label="Sound">♪</button><button class="tool" id="bPause" type="button" aria-label="Pause">II</button></div>
<div id="ov"><div id="ovIn"></div><div class="ver" id="ver"></div></div>
<div id="rotate" hidden>Turn your phone sideways to play</div>
<script>
'use strict';
/* =====================================================================
   JUMP — a Jenisan Arcade game
   A side-scrolling run through Sunny Meadow, Crystal Caverns and the
   Sunset Skyway. Stomp, shoot and bomb your way to the beacon at the end
   of each level. You carry weapons (sling, boomerang, fire wand, bombs)
   and a bag of items. Coins are banked when the run ends and spent in
   the Workshop.
   ===================================================================== */
const VERSION='0.24';
const IN_ARCADE=/^\/jump(\/|$)/.test(location.pathname);   // served inside the Arcade hub at arcade.jenisan.com/jump/
const ARCADE_URL=IN_ARCADE?'/':'https://arcade.jenisan.com/';
const SAVE='jump.save',SETK='jump.settings';
const SHOT=/[?#&]splash\b/.test(location.search+location.hash);   // renders the key art (used for splash.jpg)
const $=id=>document.getElementById(id);
const cv=$('game'),ctx=cv.getContext('2d'),ov=$('ov'),ovIn=$('ovIn');
// World: 32-unit tiles, 15 rows tall; the view always shows the full height.
const T=32,ROWS=15,WH=ROWS*T;
let VW=0,VH=0,DPR=1,SC=1,OY=0,VIEWW=640,camX=0,shake=0;
const COARSE=matchMedia('(pointer:coarse)').matches&&(/Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1)||!matchMedia('(any-pointer:fine)').matches);   // phones and tablets only
document.body.classList.toggle('coarse',COARSE);
const clamp=(v,a,b)=>v<a?a:v>b?b:v,rand=(a,b)=>a+Math.random()*(b-a),irand=(a,b)=>Math.floor(rand(a,b+1)),TAU=Math.PI*2,sgn=v=>v<0?-1:v>0?1:0;

/* ---------- Settings + save ---------- */
const SET={sound:true,music:true,musicVol:.8,sfxVol:.8};
try{Object.assign(SET,JSON.parse(localStorage.getItem(SETK)||'{}'))}catch(e){}
function saveSettings(){try{localStorage.setItem(SETK,JSON.stringify(SET))}catch(e){}}
let P={bank:0,up:{},best:0,bestLevel:0,runs:0};
try{Object.assign(P,JSON.parse(localStorage.getItem(SAVE)||'{}'))}catch(e){}
P.up=Object.assign({hearts:0,boots:0,bag:0,sling:0,pouch:0,kit:0},P.up||{});
function save(){try{localStorage.setItem(SAVE,JSON.stringify(P))}catch(e){}}
const lv=k=>P.up[k]||0;

/* Workshop upgrades: bought with banked coins between runs, three levels each */
const UPG=[
  {id:'hearts',name:'Big Heart',cost:[60,150,300],desc:['3 hearts','4 hearts','5 hearts','6 hearts']},
  {id:'boots',name:'Spring Boots',cost:[80,180,320],desc:['Single jump','Double jump','Double jump, higher','Triple jump, higher']},
  {id:'bag',name:'Bigger Bag',cost:[50,120,240],desc:['2 item slots','3 item slots','4 item slots','5 item slots']},
  {id:'sling',name:'Sling Mods',cost:[40,100,200],desc:['Pebble sling','Faster reload','Heavy pebbles (2 damage)','Twin pebbles']},
  {id:'pouch',name:'Ammo Pouch',cost:[40,100,200],desc:['Standard ammo','+50% ammo per pickup','+100% ammo per pickup','+150% ammo per pickup']},
  {id:'kit',name:'Starter Kit',cost:[60,150,300],desc:['Sling only','+ Heart Snack in the bag','+ Boomerang from the start','+ Fire Wand with 6 charges']}];
const maxHearts=()=>3+lv('hearts'),bagSlots=()=>2+lv('bag'),airJumps=()=>(lv('boots')>=1?1:0)+(lv('boots')>=3?1:0);
const JUMPV=()=>[560,560,590,610][lv("boots")]*(G&&G.gear&&G.gear.feet==='hyper'?1.414:1);   // hyper boots: twice the height (v × √2)

/* Weapons and items */
const WPN={
  sling:{name:'Sling',ammo:false,desc:'Pebbles fly in a short arc. Never runs out.'},
  boom:{name:'Boomerang',ammo:false,desc:'Cuts through every enemy on its path and flies back to you. One in the air at a time.'},
  wand:{name:'Fire Wand',ammo:true,give:6,desc:'Fireballs bounce along the ground. 2 damage. Uses charges.'},
  bomb:{name:'Bombs',ammo:true,give:3,desc:'Lobbed in an arc; the blast does 3 damage, breaks bricks and opens crates.'},
  wrench:{name:'Wrench',ammo:false,desc:'A close-range swing. 2 damage, smashes bricks and opens crates. Never runs out.'},
  laser:{name:'Laser Gun',ammo:true,give:40,desc:'Hold fire for a solid beam that burns whatever it touches first. Stops at walls and blocks. Drains cells while firing.'}};
const WORDER=['sling','boom','wand','bomb','wrench','laser'];   // every weapon; the toolbar (G.bar) holds any five of them
const BAR0=['sling','boom','wand','bomb','wrench'];
const AMMO_WORD={wand:'charges',bomb:'bombs',laser:'cells'};
/* Gear: worn items, one per slot, picked in the inventory */
const GEAR={boots:{slot:'feet',name:'Work Boots',desc:'Standard steel-toes.'},
  hyper:{name:'Hyper Boots',slot:'feet',desc:'Jump twice as high.'},
  jet:{name:'Jet Pack',slot:'back',desc:'Jump again in mid-air and hold to fly. Needs fuel cans; burns fuel fast.',thrust:3000,top:260,burn:55},
  turbo:{name:'Turbo Jet Pack',slot:'back',desc:'Stronger thrust and a faster climb than the Jet Pack. Same fuel.',thrust:3800,top:390,burn:62}};
const GORDER=['boots','hyper','jet','turbo'];
const FUEL_CAN=35,FUEL_MAX=100;
let CHEAT=false;
const ITEMS={
  snack:{name:'Heart Snack',desc:'Restores one heart.'},
  shield:{name:'Bubble Shield',desc:'Blocks the next hit. Lasts 15 s.'},
  feather:{name:'Feather',desc:'15 s: one extra air jump, and hold jump to glide.'},
  magnet:{name:'Coin Magnet',desc:'15 s: pulls in coins from all around you.'},
  pepper:{name:'Ember Pepper',desc:'8 s: run faster and burn through enemies on contact.'}};
const IORDER=['snack','shield','feather','magnet','pepper'];

/* ---------- Painted UI (atlas cut from the supplied UI sheet; numbers are always drawn live on top) ---------- */
const UIR={"heart":[0,0,104,93],"coins":[106,0,117,100],"boot":[225,0,138,119],"wrench":[365,0,124,134],"fire":[491,0,100,131],"gears":[593,0,139,130],"lock":[734,0,92,110],"sq":[828,0,128,130],"plate":[0,136,274,136],"bar":[276,136,381,84],"hazard":[659,136,435,42],"warn":[0,274,106,93],"gauge":[108,274,184,176]};
const BAR_CH=[41,22,299,36];   // the bar's channel, in bar pixels (its baked fill is covered and drawn live)
const UIMG=new Image();let uiOK=false;UIMG.onload=()=>uiOK=true;UIMG.src='ui.webp';
function uiPic(g,n,x,y,w,h){const r=UIR[n];if(!uiOK||!r)return false;if(h==null)h=w*r[3]/r[2];g.drawImage(UIMG,r[0],r[1],r[2],r[3],x,y,w,h);return true}

/* ---------- Themes ---------- */
const THEMES=[
  {id:'meadow',name:'The Outskirts',sky:['#5f8fc0','#a9b8c4','#8a7a68'],far:'#3a3436',farDk:'#2c2729',near:'#252124',nearDk:'#1b1819',smoke:'#6b605b',sun:'rgba(255,170,90,.55)',top:'#52c94c',topHi:'#9cee6f',dirt:'#5a3d26',dirtDk:'#3e2817',brick:'#8e3c26',brickDk:'#5a2416',stone:'#9a948e',stoneDk:'#5f5a55',plank:'#8a7f78',plankDk:'#4f4844',ceil:false,tile:{top:0,fill:1,fill2:2,brick:3,brick2:4,stone:5}},
  {id:'cave',name:'The Undercity',sky:['#0e0f12','#17181c','#24221f'],far:'#1d1d21',farDk:'#151518',near:'#26252a',nearDk:'#1c1b1f',smoke:'#3a3836',sun:'',top:'#5c6b46',topHi:'#86986a',dirt:'#2a2a2e',dirtDk:'#1d1d20',brick:'#2c2c30',brickDk:'#151517',stone:'#6a625c',stoneDk:'#3e3934',plank:'#8a7f78',plankDk:'#4f4844',ceil:true,tile:{top:6,fill:7,fill2:8,brick:9,brick2:9,stone:10}},
  {id:'sky',name:'The Foundry',sky:['#2a120c','#6e2812','#e2652a'],far:'#3b1f17',farDk:'#2b1510',near:'#24120d',nearDk:'#170b08',smoke:'#4a2f26',sun:'rgba(255,190,90,.7)',top:'#9aa0a6',topHi:'#c9ced3',dirt:'#6b4a36',dirtDk:'#4a3122',brick:'#8e3c26',brickDk:'#5a2416',stone:'#8f8a86',stoneDk:'#55504c',plank:'#8a7f78',plankDk:'#4f4844',ceil:false,tile:{top:11,fill:12,fill2:13,brick:14,brick2:14,stone:15}}];
// block tiles cut from the supplied block sheet (64 px cells in tiles.webp; last cell = plank strip)

const isSolid=v=>v>=1&&v<=5;
function mulberry(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
let L=null;
function genLevel(n,seed,thi,demo){
  const R=mulberry(seed),ri=(a,b)=>a+Math.floor(R()*(b-a+1)),ch=p=>R()<p,th=THEMES[thi],d=n;
  const W=140+Math.min(100,n*9),cap=W+80;
  const tiles=new Uint8Array(cap*ROWS),set=(x,y,v)=>{if(x>=0&&x<cap&&y>=0&&y<ROWS)tiles[y*cap+x]=v},get=(x,y)=>x>=0&&x<cap&&y>=0&&y<ROWS?tiles[y*cap+x]:0;
  const ents=[],coins=[];let x=0,g=12,cp=0,crates=0;
  const ground=(x0,len,top)=>{for(let i=0;i<len;i++)for(let y=top;y<ROWS;y++)set(x0+i,y,1)};
  const coin=(cx,cy)=>{if(cy>=(th.ceil?3:1)&&!get(cx,cy))coins.push([cx,cy])};
  const coinRow=(x0,len,cy)=>{for(let i=0;i<len;i++)coin(x0+i,cy)};
  const coinArc=(x0,len,cy)=>{for(let i=0;i<len;i++)coin(x0+i,cy-Math.round(Math.sin(Math.PI*i/Math.max(1,len-1))*2))};
  const pool=['beetle','beetle'].concat(d>=1?['hopper','lurker']:[],d>=2?['bat','burr','zapper']:[],d>=3?['spiky']:[],d>=4?['beetle','hopper','burr','zapper','spiky']:[]);
  const enemy=(k,tx,ty)=>ents.push({k,tx,ty});
  const enemiesOn=(x0,len,top,cnt)=>{for(let i=0;i<cnt;i++){const ex=x0+ri(0,Math.max(0,len-1));if(get(ex,top-1)===7||ex<14)continue;const k=pool[ri(0,pool.length-1)];enemy(k,ex,k==='bat'?top-ri(3,4):top)}};
  const ceil=th.ceil?2:0;
  const SEG={
    flat(){const n=ri(4,8);ground(x,n,g);if(ch(.5))coinRow(x+1,n-2,g-2);enemiesOn(x+1,n-2,g,ri(0,1+Math.min(2,d/3|0)));x+=n},
    pit(){const n=ri(2,Math.min(5,2+(d/2|0)));ground(x,2,g);x+=2;coinArc(x-1,n+2,g-1);x+=n;ground(x,2,g);x+=2},
    steps(){const h=ri(2,4);for(let i=0;i<h;i++){ground(x,1,g);for(let k=0;k<=i;k++)set(x,g-1-k,5);x++}
      if(!demo&&ch(.5)){const gap=ri(2,3);coinArc(x,gap,g-h-1);x+=gap}
      for(let i=h-1;i>=0;i--){ground(x,1,g);for(let k=0;k<=i;k++)set(x,g-1-k,5);x++}ground(x,2,g);x+=2},
    blocks(){const n=ri(7,10);ground(x,n,g);const by=g-4,bx=x+ri(1,2),bl=ri(3,5);let any=false;
      for(let i=0;i<bl;i++){const c=ch(.3);set(bx+i,by,c?3:2);any=any||c}if(!any)set(bx+(bl>>1),by,3);crates++;
      if(ch(.45)&&by-4>=ceil+1){set(bx+(bl>>1),by-4,3);coin(bx+(bl>>1)-1,by-5)}
      enemiesOn(x+1,n-2,g,ri(0,2));x+=n},
    platforms(){const n=ri(6,9);ground(x,2,g);x+=2;let px=x,first=true;while(px<x+n-1){const len=ri(2,3),py=g-ri(2,first?3:4);first=false;for(let i=0;i<len;i++)set(px+i,py,6);if(ch(.6))coinRow(px,len,py-1);px+=len+ri(1,2)}x+=n;ground(x,2,g);x+=2},
    hill(){const ng=clamp(g+[-2,-1,1,2][ri(0,3)],8,12);g=ng;const n=ri(4,7);ground(x,n,g);if(ch(.4))coinRow(x+1,n-2,g-1);enemiesOn(x+1,n-2,g,ri(0,1));x+=n},
    pillars(){ground(x,2,g);x+=2;const k=ri(2,4);for(let i=0;i<k;i++){x+=ri(1,2);const h=ri(0,2),pw=ri(1,2);for(let j=0;j<pw;j++)for(let y=g-h;y<ROWS;y++)set(x+j,y,y<g?5:1);coin(x,g-h-1);x+=pw}x+=ri(1,2);ground(x,2,g);x+=2},
    spikes(){const n=ri(8,10);ground(x,n,g);const s=ri(2,Math.min(4,2+(d/3|0))),sx=x+3;for(let i=0;i<s;i++)set(sx+i,g-1,7);coinArc(sx-1,s+2,g-2);x+=n},
    mover(){const n=ri(7,10);ground(x,2,g);x+=2;ents.push({k:'mplat',tx:x,ty:g,w:3,x0:x*T,x1:(x+n-3)*T,sp:55+d*5});coinRow(x+1,n-2,g-3);x+=n;ground(x,2,g);x+=2},
    gauntlet(){const n=ri(9,12);ground(x,n,g);enemiesOn(x+2,n-3,g,ri(2,3+Math.min(2,d/3|0)));if(ch(.5))coinRow(x+2,n-4,g-3);x+=n},
    tower(){const n=ri(7,9);ground(x,n,g);const tx=x+ri(3,n-3),h=ri(1,2);for(let y=g-h;y<g;y++)set(tx,y,5);enemy('sentry',tx,g-h);x+=n},
    crusher(){const n=ri(8,10);ground(x,n,g);const k=ri(1,2);for(let i=0;i<k;i++)ents.push({k:'crush',tx:x+2+i*4});coinRow(x+1,n-2,g-1);x+=n}};
  const W8=th.id==='meadow'?{flat:3,pit:2,steps:1.4,blocks:3,platforms:1,hill:2,pillars:1,spikes:.7,mover:.6,gauntlet:1.4,tower:d>=3?.8:0}
    :th.id==='cave'?{flat:2.5,pit:1.6,steps:1.2,blocks:2.6,platforms:1.2,hill:1.2,pillars:1,spikes:1.4,mover:.6,gauntlet:1.4,tower:d>=3?.8:0,crusher:1.5}
    :{flat:1.6,pit:3,steps:.8,blocks:2,platforms:2.4,hill:1,pillars:2,spikes:.6,mover:1.8,gauntlet:1.2,tower:d>=3?.8:0};
  if(demo)for(const k of ['pit','platforms','pillars','mover'])W8[k]=0;
  const keys=Object.keys(W8),tot=keys.reduce((s,k)=>s+W8[k],0);
  ground(0,14,g);x=14;let last='';
  while(x<W){
    if(!cp&&x>W*.5){ground(x,5,g);cp=x+2;x+=5;continue}
    let r=R()*tot,k=keys[0];for(const kk of keys){r-=W8[kk];if(r<=0){k=kk;break}}
    if(k===last&&(k==='pit'||k==='mover'||k==='platforms'))k='flat';last=k;SEG[k]()}
  if(!crates){ground(x,6,g);set(x+2,g-4,3);x+=6}
  ground(x,24,g);const goal=x+8;for(let i=0;i<3;i++)set(goal-3+i,g-1,0);
  const w=x+24,t=new Uint8Array(w*ROWS);
  for(let y=0;y<ROWS;y++)for(let i=0;i<w;i++)t[y*w+i]=tiles[y*cap+i];
  if(th.ceil){const crushX=new Set(ents.filter(e=>e.k==='crush').flatMap(e=>[e.tx,e.tx+1]));
    for(let i=0;i<w;i++){for(let y=0;y<ceil;y++)t[y*w+i]=1;if(!crushX.has(i)&&R()<.18)t[ceil*w+i]=1}}
  return{w,t,th:thi,ents,coins,cp,goal,goalY:g,seed};}

  FX.push({k:'gring',x,y,life:.4});for(let i=0;i<14;i++){const a=rand(0,TAU),v=rand(60,220);FX.push({k:'gp',x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-60,life:rand(.35,.7),r:rand(1.2,2.6)})}

/* ---------- Weapons + items ---------- */
function cycleWeapon(dir){if(G.demo||G.state!=='play')return;let own=G.bar.filter(w=>w&&G.owned[w]);if(!own.includes(G.wpn))own=[G.wpn,...own];if(own.length<2){sfx.nope();return}
  let i=own.indexOf(G.wpn);i=(i+dir+own.length)%own.length;G.wpn=own[i];G.wpnT=1.4;sfx.swap()}
function equip(w){if(G.owned[w]){G.wpn=w;G.wpnT=1.4;sfx.swap()}}
// toolbar slot i (0–4): select that weapon if Pip has found it
function selWeapon(i){if(G.demo||G.state!=='play')return;const w=G.bar[i];if(!w){sfx.nope();return}

function selItem(i){if(G.demo)return;if(i<bagSlots()){G.sel=i;sfx.click()}}

function useItem(i){if(G.demo||!(G.state==='play'||G.state==='inv'))return;i=i==null?G.sel:i;const it=G.bag[i];if(!it||PL.st!=='ok'){sfx.nope();return}

  else if(it==='shield')G.fx.shield=15;else if(it==='feather'){G.fx.feather=15;PL.featherJ=1}else if(it==='magnet')G.fx.magnet=15;else if(it==='pepper')G.fx.pepper=8;
  G.bag.splice(i,1);if(G.sel>=G.bag.length&&G.sel>0&&!G.bag[G.sel])G.sel=Math.max(0,Math.min(G.sel,G.bag.length-1));
  sfx.use();floatText(PL.x,PL.y-40,ITEMS[it].name,'#9ff0ff');FX.push({k:'ring',x:PL.x,y:PL.y-14,life:.5,c:'#9ff0ff'})}
function ammoGive(w){return Math.round(WPN[w].give*(1+.5*lv('pouch')))}
function fire(){const p=PL,w=G.wpn,f=p.face,x=p.x+f*12,y=p.y-17;
  if(WPN[w].ammo&&G.ammo[w]<=0){sfx.nope();floatText(p.x,p.y-40,'Out of '+AMMO_WORD[w],'#ff9db6');const own=WORDER.filter(k=>G.owned[k]&&(!WPN[k].ammo||G.ammo[k]>0));G.wpn=own.includes('boom')?'boom':'sling';p.fireT=.3;return}
  p.shotT=t;
  if(w==='sling'){const twin=lv('sling')>=3,dmg=lv('sling')>=2?2:1;PJ.push({k:'pebble',x,y,vx:f*430+p.vx*.3,vy:-110,life:1,dmg,r:4});if(twin)PJ.push({k:'pebble',x,y:y+2,vx:f*400+p.vx*.3,vy:-230,life:1,dmg,r:4});p.fireT=lv('sling')>=1?.22:.32;sfx.sling()}
  else if(w==='boom'){if(PJ.some(q=>q.k==='boom')){p.fireT=.05;return}PJ.push({k:'boom',x,y,vx:f*460,vy:0,life:3,dmg:1,r:9,out:.42,hit:new Set(),a:0});p.fireT=.2;sfx.boom()}
  else if(w==='wand'){G.ammo.wand--;PJ.push({k:'fire',x,y,vx:f*300,vy:60,life:2.2,dmg:2,r:6,b:0});p.fireT=.26;sfx.fire()}
  else if(w==='wrench'){wrenchSwing(p,f);p.fireT=.34}
  else if(w==='laser'){p.fireT=0}   // the beam itself runs in updatePlayer while fire is held
  else if(w==='bomb'){G.ammo.bomb--;PJ.push({k:'bomb',x,y:y-4,vx:f*230+p.vx*.4,vy:-330,life:1.4,dmg:3,r:7});p.fireT=.5;sfx.toss()}}

// wrench: hits everything in a short box in front of Pip, smashes bricks / opens crates at chest and head height
function wrenchSwing(p,f){FX.push({k:'swing',x:p.x,y:p.y-17,f,life:.2});sfx.toss();let hit=false;
  const x0=Math.min(p.x,p.x+f*38),x1=Math.max(p.x,p.x+f*38);
  for(const e of EN){if(e.st!=='ok')continue;if(e.x+e.w/2>x0&&e.x-e.w/2<x1&&e.y>p.y-40&&e.y-e.h<p.y){damageEnemy(e,2);hit=true;FX.push({k:'spark',x:e.x-f*e.w/3,y:e.y-e.h/2,life:.2,c:'#fff'})}}
  const cx=Math.floor((p.x+f*24)/T);for(const yy of [p.y-10,p.y-26]){const cy=Math.floor(yy/T),v=tile(cx,cy);if(v===2||v===3){bumpTile(cx,cy,true);hit=true}}
  if(hit){shake=Math.max(shake,3);padRumble(80,.4)}}

// laser: a solid beam from the gun that stops at the first wall, block or enemy; burns that enemy while it stays on it
function laserBeam(p,dt){const f=p.face,x0=p.x+f*13,y0=p.y-17;let x=x0,hit=null;
  for(let d=0;d<460;d+=3){x=x0+f*d;if(solidAt(x,y0))break;
    hit=EN.find(e=>e.st==='ok'&&Math.abs(x-e.x)<e.w/2&&y0>e.y-e.h&&y0<e.y+2);if(hit)break}
  G.ammo.laser=Math.max(0,G.ammo.laser-20*dt);G.beam={x0,y0,x1:x,hit:!!hit};
  if(hit){hit.lz=(hit.lz||0)+dt*7;while(hit.lz>=1&&hit.st==='ok'){hit.lz-=1;damageEnemy(hit,1)}}
  if(Math.random()<dt*25)FX.push({k:'spark',x,y:y0+rand(-3,3),life:.15,c:hit?'#fff':'#ff8a6a'});
  if((G.lzSnd=(G.lzSnd||0)-dt)<=0){G.lzSnd=.08;sfx.laser()}
  if(G.ammo.laser<=0){floatText(p.x,p.y-40,'Out of cells','#ff9db6')}}
function drawBeam(){const b=G.beam;if(!b)return;const fl=.75+.25*Math.sin(t*60);ctx.save();ctx.globalCompositeOperation='lighter';ctx.lineCap='round';
  ctx.strokeStyle=`rgba(255,40,40,${.28*fl})`;ctx.lineWidth=10;ctx.beginPath();ctx.moveTo(b.x0,b.y0);ctx.lineTo(b.x1,b.y0);ctx.stroke();
  ctx.strokeStyle=`rgba(255,90,80,${.7*fl})`;ctx.lineWidth=4;ctx.stroke();ctx.strokeStyle='rgba(255,235,230,.95)';ctx.lineWidth=1.6;ctx.stroke();
  const g=ctx.createRadialGradient(b.x1,b.y0,1,b.x1,b.y0,12);g.addColorStop(0,'rgba(255,240,220,.95)');g.addColorStop(1,'rgba(255,60,40,0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(b.x1,b.y0,12*fl,0,TAU);ctx.fill();
  const g2=ctx.createRadialGradient(b.x0,b.y0,1,b.x0,b.y0,7);g2.addColorStop(0,'rgba(255,220,210,.9)');g2.addColorStop(1,'rgba(255,60,40,0)');ctx.fillStyle=g2;ctx.beginPath();ctx.arc(b.x0,b.y0,7,0,TAU);ctx.fill();ctx.restore()}
// jet pack on Pip's back (behind the sprite), with a flame while it's burning
function drawJetpack(p){if(!G.gear||!G.gear.back||p.st==='dead')return;const f=p.face,x=p.x-f*8,y=p.y-24,turbo=G.gear.back==='turbo';
  if(p.jetting){ctx.save();ctx.globalCompositeOperation='lighter';for(const dx of [-2.5,2.5]){const L=10+Math.random()*8,g=ctx.createLinearGradient(0,y+12,0,y+12+L);g.addColorStop(0,'rgba(255,250,200,.95)');g.addColorStop(.4,'rgba(255,150,40,.8)');g.addColorStop(1,'rgba(255,60,20,0)');ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(x+dx-2.4,y+12);ctx.lineTo(x+dx+2.4,y+12);ctx.lineTo(x+dx,y+12+L);ctx.fill()}ctx.restore()}
  for(const dx of [-2.5,2.5]){shape(lg(y,y+12,turbo?'#ff9a3d':'#a7adb3',turbo?'#a8461a':'#4f555b'),()=>{rr(ctx,x+dx-2.4,y,4.8,12,2.2)},1);ctx.fillStyle='#2a2522';ctx.fillRect(x+dx-1.6,y+11,3.2,2)}
  ctx.fillStyle='#3a332e';ctx.fillRect(x-4,y+4,8,2)}
/* ---------- Physics ----------
   Bodies: x = centre, y = feet. Tile collision is resolved one axis at a time. */
function moveBody(b,dx,dy,oneway){const r={wall:0,land:false,head:null};
  if(dx){b.x+=dx;const y0=Math.floor((b.y-b.h+1)/T),y1=Math.floor((b.y-1)/T);
    if(dx>0){const cx=Math.floor((b.x+b.w/2)/T);for(let cy=y0;cy<=y1;cy++)if(isSolid(tile(cx,cy))){b.x=cx*T-b.w/2-.01;r.wall=1;break}}
    else{const cx=Math.floor((b.x-b.w/2)/T);for(let cy=y0;cy<=y1;cy++)if(isSolid(tile(cx,cy))){b.x=(cx+1)*T+b.w/2+.01;r.wall=-1;break}}}
  if(dy){const prev=b.y;b.y+=dy;const x0=Math.floor((b.x-b.w/2+1)/T),x1=Math.floor((b.x+b.w/2-1)/T);
    if(dy>0){const cy=Math.floor(b.y/T);for(let cx=x0;cx<=x1;cx++){const v=tile(cx,cy);if(isSolid(v)||(oneway&&v===6&&prev<=cy*T+.5)){b.y=cy*T;r.land=true;break}}}
    else{const cy=Math.floor((b.y-b.h)/T);let hc=null;for(let cx=x0;cx<=x1;cx++)if(isSolid(tile(cx,cy))){if(hc==null||Math.abs((cx+.5)*T-b.x)<Math.abs((hc+.5)*T-b.x))hc=cx}
      if(hc!=null){b.y=(cy+1)*T+b.h;r.head={cx:hc,cy}}}}
  return r}
const overlap=(a,b)=>Math.abs(a.x-b.x)<(a.w+b.w)/2&&a.y-a.h<b.y&&b.y-b.h<a.y;

/* ---------- Blocks ---------- */
function bumpTile(cx,cy,byBlast){const v=tile(cx,cy);
  if(v===2){setT(cx,cy,0);for(let i=0;i<4;i++)FX.push({k:'bit',x:cx*T+8+(i%2)*16,y:cy*T+8+(i>>1)*16,vx:(i%2?1:-1)*rand(60,130),vy:-rand(220,380),life:1.2,c:theme().brick});
    sfx.brick();addScore(10);shake=Math.max(shake,2);if(Math.random()<.1)popCoin(cx,cy)}
  else if(v===3){setT(cx,cy,4);OPENED.set(cx+','+cy,t);BUMP.set(cx+','+cy,.18);sfx.crate();addScore(50);crateDrop(cx,cy)}
  else{if(!byBlast){BUMP.set(cx+','+cy,.1);sfx.bump()}return}
  // anything standing on the block gets knocked off
  for(const e of EN)if(e.st==='ok'&&Math.abs(e.x-(cx*T+T/2))<T*.8&&Math.abs(e.y-cy*T)<4)killEnemy(e,true,'bump')}
function popCoin(cx,cy){FX.push({k:'coinpop',x:cx*T+T/2,y:cy*T,vy:-360,life:.42});const X=cx*T+T/2,Y=cy*T-48;setTimeout(()=>{if(G.state==='play'||G.state==='paused')addCoin(X,Y)},380)}
function crateDrop(cx,cy){const x=cx*T+T/2,y=cy*T,r=Math.random(),n=G.n||0;
  if(G.demo){FX.push({k:'coinpop',x,y,vy:-360,life:.55});return}
  const missing=WORDER.filter(w=>!G.owned[w]&&(w!=='laser'||n>=6));   // the laser turns up from world 3-1
  if(n>=6&&!G.owned.laser&&r<.3){PK.push({k:'weapon',id:'laser',x,y,vy:-260,rise:.35});return}
  const gearMiss=[n>=2&&!G.gearOwned.hyper?'hyper':null,n>=4&&!G.gearOwned.turbo?'turbo':null].filter(Boolean);
  if(gearMiss.length&&r>.9){PK.push({k:'gear',id:gearMiss[irand(0,gearMiss.length-1)],x,y,vy:-260,rise:.35});return}
  if(r>.42&&r<.58){PK.push({k:'fuel',x,y,vy:-260,rise:.35});return}
  if(missing.length&&r<.16+.02*Math.min(n,6)){PK.push({k:'weapon',id:missing[irand(0,missing.length-1)],x,y,vy:-260,rise:.35});return}
  if(r<.5){popCoin(cx,cy);return}
  if(r<.78){const pool=['snack','snack','shield','feather','magnet','pepper'];PK.push({k:'item',id:pool[irand(0,pool.length-1)],x,y,vy:-260,rise:.35});return}
  const amm=WORDER.filter(w=>G.owned[w]&&WPN[w].ammo);if(amm.length){PK.push({k:'ammo',id:amm[irand(0,amm.length-1)],x,y,vy:-260,rise:.35});return}
  popCoin(cx,cy);setTimeout(()=>{if(G.state==='play')popCoin(cx,cy)},120)}

/* ---------- Enemies ---------- */
function killEnemy(e,flip,how){if(e.st!=='ok')return;const d=EDEF[e.k];
  if(flip){e.st='flip';e.vy=-300;e.vx=sgn(e.x-PL.x||1)*80;e.t=0}else{e.st='squash';e.t=0}
  if(how!=='demo'){addScore(d.pts,e.x,e.y-e.h);sfx.kill()}
  FX.push({k:'puff',x:e.x,y:e.y-e.h/2,life:.35});
  if(!G.demo&&Math.random()<(e.k==='sentry'?.5:.18))PK.push({k:Math.random()<.25?'heart':'coin',x:e.x,y:e.y-e.h,vy:-240,loose:true,rise:0})}
function damageEnemy(e,dmg){if(e.st!=='ok')return false;e.hp-=dmg;e.hurt=.15;if(e.k==='bat')e.awake=true;if(e.hp<=0){killEnemy(e,true);return true}sfx.hit();return false}
function updateEnemies(dt){const p=PL,vx0=camX-120,vx1=camX+VIEWW+160;
  for(const e of EN){
    if(e.st==='squash'){e.t+=dt;continue}
    if(e.st==='flip'){e.t+=dt;e.vy+=1400*dt;e.x+=e.vx*dt;e.y+=e.vy*dt;continue}
    if(e.x<vx0||e.x>vx1)continue;   // enemies wait off-screen until you get near
    e.t+=dt;e.hurt=Math.max(0,e.hurt-dt);
    if(e.k==='lurker'&&!e.awake){e.vy=Math.min(900,e.vy+1600*dt);const r=moveBody(e,0,e.vy*dt,true);if(r.land)e.vy=0;
      if(Math.abs(p.x-e.x)<110&&Math.abs(p.y-e.y)<90&&p.st==='ok'){e.awake=true;e.h=24;e.y-=1;e.vy=-300;e.face=sgn(p.x-e.x)||-1;e.vx=e.face*e.sp;e.edge=true;if(!G.demo)sfx.crate();FX.push({k:'puff',x:e.x,y:e.y,life:.35})}
      continue}
    if(e.k==='zapper'){e.zc-=dt;e.zap=Math.max(0,e.zap-dt);if(e.zc<=0){e.zap=.6;e.zc=rand(1.8,2.6);if(!G.demo&&Math.abs(e.x-p.x)<VIEWW*.6)sfx.shield()}
      if(e.zap>0&&Math.random()<.6)FX.push({k:'gp',x:e.x+rand(-14,14),y:e.y-rand(4,22),vx:rand(-120,120),vy:-rand(40,160),life:rand(.15,.3),r:rand(.8,1.6)})}
    if(e.k==='beetle'||e.k==='burr'||e.k==='spiky'||e.k==='zapper'||e.k==='lurker'){if(!e.vx)e.vx=-e.sp;e.vy=Math.min(900,e.vy+1600*dt);
      const r=moveBody(e,e.vx*dt,e.vy*dt,true);if(r.land)e.vy=0;if(r.wall){e.vx=-r.wall*e.sp}
      if(r.land&&e.edge){const ax=e.x+sgn(e.vx)*(e.w/2+2),cy=Math.floor(e.y/T);if(!isSolid(tile(Math.floor(ax/T),cy))&&tile(Math.floor(ax/T),cy)!==6)e.vx=-e.vx}
      if(r.land&&tile(Math.floor(e.x/T),Math.floor((e.y-4)/T))===7)e.vx=-e.vx;
      e.face=sgn(e.vx)}
    else if(e.k==='hopper'){e.vy=Math.min(900,e.vy+1500*dt);const r=moveBody(e,e.vx*dt,e.vy*dt,true);if(r.wall)e.vx=-e.vx*.5;
      if(r.land){e.vy=0;e.vx=0;e.fireT-=dt;if(e.fireT<=0&&Math.abs(p.x-e.x)<340){e.fireT=rand(1,1.6);e.face=sgn(p.x-e.x)||-1;e.vx=e.face*rand(80,120);e.vy=-rand(380,470)}}}
    else if(e.k==='bat'){if(!e.awake&&Math.abs(p.x-e.x)<230)e.awake=true;
      if(e.awake){e.face=sgn(p.x-e.x)||1;e.x+=e.face*72*dt;e.y=e.base+Math.sin(e.t*3)*34+clamp((p.y-30-e.base)*.4,-40,60)}}
    else if(e.k==='sentry'){e.face=sgn(p.x-e.x)||-1;e.fireT-=dt;if(e.fireT<=0&&Math.abs(p.x-e.x)<VIEWW*.7){e.fireT=Math.max(1.4,2.4-.08*G.n);PJ.push({k:'seed',x:e.x+e.face*22,y:e.y-15,vx:e.face*170,vy:0,life:4,r:5,foe:true});e.shot=t;sfx.shoot()}}
    if(e.y>WH+60)e.st='gone'}
  EN=EN.filter(e=>e.st!=='gone'&&!(e.st==='squash'&&e.t>.45)&&!(e.st==='flip'&&e.y>WH+80))}
function updateCrushers(dt){for(const c of CR){c.t+=dt;const cx=Math.floor(c.x/T);
    if(c.st==='wait'){c.y=c.y0;if(PL.st==='ok'&&Math.abs(PL.x-c.x)<70&&PL.y>c.y&&c.x>camX-40&&c.x<camX+VIEWW+40){c.st='fall';c.vy=0}}
    else if(c.st==='fall'){c.vy=(c.vy||0)+1800*dt;c.y+=c.vy*dt;const by=c.y+c.h,cy=Math.floor(by/T);
      if(isSolid(tile(cx-1,cy))||isSolid(tile(cx,cy))){c.y=cy*T-c.h;c.st='rest';c.t=0;shake=Math.max(shake,5);sfx.crush();padRumble(200,.6);FX.push({k:'puff',x:c.x-20,y:c.y+c.h,life:.4},{k:'puff',x:c.x+20,y:c.y+c.h,life:.4})}}
    else if(c.st==='rest'){if(c.t>.9)c.st='rise'}
    else if(c.st==='rise'){c.y-=70*dt;if(c.y<=c.y0){c.y=c.y0;c.st='cool';c.t=0}}
    else if(c.st==='cool'){if(c.t>.8)c.st='wait'}}}

/* ---------- Projectiles ---------- */
function blast(x,y){const R=60;FX.push({k:'blast',x,y,life:.45});sfx.blast();shake=Math.max(shake,7);padRumble(250,.7);
  for(const e of EN)if(e.st==='ok'&&Math.hypot(e.x-x,e.y-e.h/2-y)<R+e.w/2)damageEnemy(e,3);
  for(let cx=Math.floor((x-R)/T);cx<=Math.floor((x+R)/T);cx++)for(let cy=Math.floor((y-R)/T);cy<=Math.floor((y+R)/T);cy++){const v=tile(cx,cy);if((v===2||v===3)&&Math.hypot(cx*T+T/2-x,cy*T+T/2-y)<R+12)bumpTile(cx,cy,true)}
  if(!G.demo&&PL.st==='ok'&&Math.hypot(PL.x-x,PL.y-14-y)<R*.55)hurt()}
const solidAt=(x,y)=>isSolid(tile(Math.floor(x/T),Math.floor(y/T)));
function bombGo(q){if(q.done)return;q.done=1;q.life=0;blast(q.x,q.y)}
function updateProjectiles(dt){const p=PL;
  for(const q of PJ){q.life-=dt;
    if(q.k==='pebble'){q.vy+=700*dt}
    else if(q.k==='fire'){q.vy+=1100*dt}
    else if(q.k==='bomb'){q.vy+=900*dt}
    else if(q.k==='boom'){q.a+=dt*22;q.out-=dt;if(q.out<=0){const dx=p.x-q.x,dy=p.y-16-q.y,dd=Math.hypot(dx,dy)||1;q.vx+=(dx/dd*1600-q.vx)*Math.min(1,dt*4);q.vy+=(dy/dd*1600-q.vy)*Math.min(1,dt*4);const sp=Math.hypot(q.vx,q.vy);if(sp>520){q.vx*=520/sp;q.vy*=520/sp}if(dd<22){q.life=0;continue}}}
    if(q.k==='bomb'&&q.life<=0){bombGo(q);continue}
    let nx=q.x+q.vx*dt,ny=q.y+q.vy*dt;
    if(q.k==='fire'&&q.vy>0&&solidAt(q.x,ny+q.r)){q.vy=-290;q.b++;ny=Math.floor((ny+q.r)/T)*T-q.r;if(q.b>6){q.life=0;continue}}
    if(solidAt(nx,ny)){
      if(q.k==='bomb'){bombGo(q);continue}
      if(q.k==='boom'){q.out=0;q.vx=-q.vx*.4;q.vy=-q.vy*.4;continue}
      q.life=0;FX.push({k:'spark',x:q.x,y:q.y,life:.2,c:q.k==='fire'?'#ff8a3d':'#ddd'});continue}
    q.x=nx;q.y=ny;
    if(q.foe){if(PL.st==='ok'&&Math.abs(q.x-p.x)<p.w/2+q.r&&q.y>p.y-p.h&&q.y<p.y){q.life=0;hurt()}continue}
    for(const e of EN){if(e.st!=='ok')continue;if(Math.abs(q.x-e.x)<e.w/2+q.r&&q.y>e.y-e.h-q.r&&q.y<e.y+q.r){
      if(q.k==='boom'){if(q.hit.has(e))continue;q.hit.add(e);damageEnemy(e,q.dmg);continue}
      if(q.k==='bomb'){bombGo(q);break}
      damageEnemy(e,q.dmg);q.life=0;FX.push({k:'spark',x:q.x,y:q.y,life:.2,c:'#fff'});break}}
    if(q.y>WH+40)q.life=0}
  PJ=PJ.filter(q=>q.life>0)}

/* ---------- Pickups ---------- */
function updatePickups(dt){const p=PL,mag=G.fx&&G.fx.magnet>0;
  for(const k of PK){
    if(k.rise>0){k.rise-=dt;k.y-=70*dt;continue}
    if(!k.fixed){k.vy=(k.vy||0)+1200*dt;k.w=16;k.h=16;const r=moveBody(k,(k.vx||0)*dt,k.vy*dt,true);if(r.land)k.vy=0;if(k.y>WH+40)k.gone=1}
    if(mag&&k.k==='coin'&&Math.hypot(k.x-p.x,k.y-(p.y-14))<220){const dx=p.x-k.x,dy=p.y-14-k.y,dd=Math.hypot(dx,dy)||1;k.fixed=true;k.x+=dx/dd*420*dt;k.y+=dy/dd*420*dt}
    if(p.st!=='ok')continue;
    const ky=k.fixed?k.y+8:k.y;if(Math.abs(k.x-p.x)<p.w/2+9&&ky>p.y-p.h-4&&ky-16<p.y){
      if(k.k==='coin'){addCoin(k.x,k.y);k.gone=1}
      else if(k.k==='heart'){if(!G.demo){G.hearts=Math.min(maxHearts(),G.hearts+1);G.heartFlash=.7;sfx.item();floatText(k.x,k.y-20,'+1 heart','#ff9db6')}k.gone=1}
      else if(k.k==='item'){if(G.demo){k.gone=1;continue}if(G.bag.length>=bagSlots()){if(!k.full){k.full=1;floatText(k.x,k.y-24,'Bag full','#ff9db6');sfx.nope()}continue}
        G.bag.push(k.id);sfx.item();floatText(k.x,k.y-24,ITEMS[k.id].name,'#9ff0ff');k.gone=1}
      else if(k.k==='weapon'){if(!G.demo){G.owned[k.id]=true;if(WPN[k.id].ammo)G.ammo[k.id]+=ammoGive(k.id);sfx.weapon();G.wpnT=1.4;
        let si=G.bar.indexOf(k.id);if(si<0){si=G.bar.findIndex(w=>!w||!G.owned[w]);if(si>=0)G.bar[si]=k.id}
        if(si>=0)G.wpn=k.id;setMsg(WPN[k.id].name,2.2,(si>=0?`Slot ${si+1}`:'Put it on your toolbar in the inventory (I)')+(WPN[k.id].ammo?` · ${G.ammo[k.id]} ${AMMO_WORD[k.id]}`:''))}k.gone=1}
      else if(k.k==='fuel'){if(!G.demo){G.fuel+=FUEL_CAN;sfx.item();floatText(k.x,k.y-24,`+${FUEL_CAN} jet fuel`,'#ffb03a')}k.gone=1}
      else if(k.k==='gear'){if(!G.demo){G.gearOwned[k.id]=true;sfx.weapon();const sl=GEAR[k.id].slot;G.gear[sl]=k.id;setMsg(GEAR[k.id].name,2.2,'Now wearing · swap gear in the inventory (I)')}k.gone=1}
      else if(k.k==='ammo'){if(!G.demo){const n=ammoGive(k.id);G.ammo[k.id]+=n;sfx.item();floatText(k.x,k.y-24,`+${n} ${AMMO_WORD[k.id]}`,'#ffd64a')}k.gone=1}}
    else if(k.full&&Math.abs(k.x-p.x)>40)k.full=0}
  PK=PK.filter(k=>!k.gone)}

/* ---------- Player ---------- */
function hurt(){const p=PL;if(G.demo||p.inv>0||p.st!=='ok'||G.phase!=='run')return;if(G.fx.pepper>0)return;
  if(G.fx.shield>0){G.fx.shield=0;p.inv=1;sfx.shield();FX.push({k:'ring',x:p.x,y:p.y-14,life:.5,c:'#9ff0ff'});return}
  G.hearts--;p.inv=1.5;p.vy=-300;p.vx=-p.face*180;shake=Math.max(shake,6);sfx.hurt();padRumble(250,.8);if(G.hearts<=0)die('hit')}
function die(why){const p=PL;if(p.st!=='ok')return;p.st='dead';p.why=why;p.vy=why==='fall'?0:-560;p.vx=0;G.phase='dying';G.pt=0;padRumble(500,1);
  if(G.demo){G.pt=1.4;return}if(why==='fall')sfx.fall();else sfx.die();G.hearts=0}
// attract-mode pilot: runs right, jumps at walls, edges, spikes and enemies, waits for moving platforms
function demoInput(){const p=PL,f=1,feet=Math.floor(p.y/T),hasGround=x=>{const v=tile(Math.floor(x/T),feet);return isSolid(v)||v===6||MP.some(m=>x>m.x&&x<m.x+m.w&&Math.abs(m.y-p.y)<6)};
  let J=false,R=true;
  const wall=isSolid(tile(Math.floor((p.x+20)/T),Math.floor((p.y-4)/T)))||isSolid(tile(Math.floor((p.x+20)/T),Math.floor((p.y-36)/T)));
  if(p.ground){
    if(wall)J=true;
    if(!hasGround(p.x+p.w/2+6)){// at an edge: how far to the next footing?
      let gap=0;while(gap<12&&!hasGround(p.x+p.w/2+6+gap*T)&&!(()=>{const cx=Math.floor((p.x+gap*T)/T)+1;for(let cy=feet-4;cy<=feet+6;cy++){const v=tile(cx,cy);if((isSolid(v)||v===6)&&!isSolid(tile(cx,cy-1)))return true}return false})())gap++;
      const mv=MP.find(m=>m.x>p.x-20&&m.x<p.x+3*T&&Math.abs(m.y-p.y)<40);
      if(gap>5&&!mv){R=false}else if(gap>5&&mv){if(!(mv.x<=p.x+10&&mv.x+mv.w>p.x+30))R=false}else J=true}
    if(tile(Math.floor((p.x+28)/T),feet-1)===7||tile(Math.floor((p.x+44)/T),feet-1)===7)J=true;
    for(const e of EN)if(e.st==='ok'&&e.x>p.x&&e.x-p.x<(e.k==='hopper'?90:64)&&Math.abs(e.y-p.y)<60)J=true;
    for(const c of CR)if(c.st!=='wait'&&c.st!=='cool'&&c.x>p.x-30&&c.x-p.x<90)R=false;
    for(const c of CR)if(c.st==='wait'&&c.x-p.x>40&&c.x-p.x<90&&Math.random()<.02)R=false}
  let Lft=false;
  if(!p.ground&&p.vy>-60){// in the air: steer onto footing instead of overshooting into a pit
    const foot=x=>{const cx=Math.floor(x/T);for(let cy=Math.max(0,Math.ceil(p.y/T));cy<ROWS;cy++){const v=tile(cx,cy);if(isSolid(v)||v===6)return cy}return MP.some(m=>x>m.x&&x<m.x+m.w&&m.y>=p.y)?99:null};
    const here=foot(p.x),ahead=foot(p.x+Math.max(0,p.vx)*.3+10);if(here!==null&&ahead===null){R=false;Lft=p.vx>60}}
  if(J)jumpQ=.1;return{L:Lft,R,D:false,J:J||(!p.ground&&p.vy<0),F:false}}
function updatePlayer(dt){const p=PL,I=G.demo?demoInput():IN();
  p.inv=Math.max(0,p.inv-dt);p.fireT=Math.max(0,p.fireT-dt);p.dropT=Math.max(0,p.dropT-dt);p.squash=Math.max(0,p.squash-dt*5);
  if(p.st==='dead'){p.vy+=1500*dt;p.y+=p.vy*dt;return}
  if(p.st==='goal'){updateGoal(dt);return}
  const pep=G.fx&&G.fx.pepper>0,maxV=(pep?260:205),acc=p.ground?1500:1000;
  const want=(I.R?1:0)-(I.L?1:0);
  if(want){let sp=p.vx*want;sp=sp<maxV?Math.min(maxV,sp+(sp<0?acc*1.8:acc)*dt):Math.max(maxV,sp-1200*dt);p.vx=sp*want;p.face=want}
  else{const fr=(p.ground?1400:400)*dt;p.vx=Math.abs(p.vx)<=fr?0:p.vx-sgn(p.vx)*fr}
  // jumping: coyote time, buffered presses, air jumps from the boots and the feather
  p.coyote=p.ground?.1:Math.max(0,p.coyote-dt);jumpQ=Math.max(0,jumpQ-dt);
  if(I.D&&p.ground&&p.dropT<=0&&standingOnPlank()){p.dropT=.25;p.ground=false;p.coyote=0;p.ride=null;p.y+=1}
  if(jumpQ>0&&(p.ground||p.coyote>0)){p.vy=-JUMPV();p.ground=false;p.coyote=0;jumpQ=0;p.air=airJumps();p.featherJ=G.fx&&G.fx.feather>0?1:0;p.ride=null;sfx.jump();p.squash=1}
  else if(jumpQ>0&&!p.ground&&(p.air>0||p.featherJ>0)){if(p.air>0)p.air--;else p.featherJ--;p.vy=-JUMPV()*.88;jumpQ=0;sfx.air();FX.push({k:'puff',x:p.x,y:p.y,life:.3})}
  // jet pack: a fresh jump press in mid-air (no air jumps left) lights it; hold jump to keep flying while fuel lasts
  else if(jumpQ>.1&&!p.ground&&p.coyote<=0&&!G.demo&&G.gear&&G.gear.back&&!solidAt(p.x,p.y+20)&&!MP.some(m=>p.x>m.x&&p.x<m.x+m.w&&m.y-p.y>=0&&m.y-p.y<24)){jumpQ=0;if(G.fuel>0)p.jet=true;else{sfx.nope();floatText(p.x,p.y-40,'No jet fuel','#ff9db6')}}
  const g=p.vy<0&&I.J?1100:2200;p.vy=Math.min(900,p.vy+g*dt);
  p.jetting=false;
  if(p.jet){if(!I.J||G.fuel<=0||p.ground){p.jet=false}else{const J=GEAR[G.gear.back];p.vy=Math.max(-J.top,p.vy-J.thrust*dt);G.fuel=Math.max(0,G.fuel-J.burn*dt);p.jetting=true;
    if(Math.random()<dt*30)FX.push({k:'puff',x:p.x-p.face*8,y:p.y-4,life:.25});if((p.jetSnd=(p.jetSnd||0)-dt)<=0){p.jetSnd=.09;sfx.jet()}}}
  if(G.fx&&G.fx.feather>0&&I.J&&p.vy>80)p.vy=80;
  // ride moving platforms
  if(p.ride){p.x+=p.ride.dx}
  const prevY=p.y,wasG=p.ground;p.ground=false;
  const r=moveBody(p,p.vx*dt,p.vy*dt,p.dropT<=0);
  if(r.wall)p.vx=0;
  if(r.head&&p.vy<0){p.vy=60;bumpTile(r.head.cx,r.head.cy)}
  if(r.land){p.ground=true;p.vy=0}
  p.ride=null;
  if(!r.land&&p.vy>=0)for(const m of MP){if(p.x+p.w/2>m.x&&p.x-p.w/2<m.x+m.w&&prevY<=m.y+1&&p.y>=m.y){p.y=m.y;p.vy=0;p.ground=true;p.ride=m;break}}
  if(p.ground){p.jet=false;if(!wasG){sfx.land();p.squash=.8;G.stomps=0}p.air=airJumps();if(G.fx&&G.fx.feather>0)p.featherJ=1}
  p.x=Math.max(p.w/2+2,p.x);
  if(p.ground&&Math.abs(p.vx)>10)p.anim+=dt*Math.abs(p.vx)/22;
  G.beam=null;
  if(I.F&&!G.demo&&G.wpn==='laser'&&p.st==='ok'&&G.ammo.laser>0){p.shotT=t;laserBeam(p,dt)}
  else if(I.F&&p.fireT<=0&&!G.demo)fire();
  // spikes
  const fy=Math.floor((p.y-3)/T);for(const cx of [Math.floor((p.x-p.w/2+3)/T),Math.floor((p.x+p.w/2-3)/T)])if(tile(cx,fy)===7&&p.y-fy*T>14){if(G.fx.pepper>0||G.demo){}else{hurt();if(p.st==='ok'){p.vy=-420;p.ground=false}}break}
  if(p.y>WH+50){die('fall');return}
  // enemies: stomp from above, or get hurt
  for(const e of EN)if(e.k==='zapper'&&e.st==='ok'&&e.zap>0&&!G.demo&&Math.hypot(p.x-e.x,p.y-14-(e.y-12))<40)hurt();
  for(const e of EN){if(e.st!=='ok'||!overlap(p,e))continue;
    const d=EDEF[e.k];
    if(e.k==='lurker'&&!e.awake){if(p.vy>0&&prevY<=e.y-e.h+8){e.hp=0;killEnemy(e,false,'stomp');sfx.stomp();p.vy=I.J?-520:-330}continue}
    if(e.k==='zapper'&&e.zap>0&&!(G.fx&&G.fx.pepper>0)){if(G.demo){killEnemy(e,true,'demo');continue}hurt();continue}
    if(G.fx&&G.fx.pepper>0){killEnemy(e,true);continue}
    if(d.stomp&&p.vy>0&&prevY<=e.y-e.h+8){G.stomps++;e.hp=0;killEnemy(e,false,'stomp');const bonus=[0,0,100,300,700][Math.min(4,G.stomps-1)]||1000;if(bonus)addScore(bonus,e.x,e.y-e.h-14);sfx.stomp();p.vy=I.J?-520:-330;p.air=airJumps();continue}
    if(G.demo){killEnemy(e,true,'demo');continue}
    hurt()}
  for(const c of CR)if(c.st!=='wait'&&Math.abs(p.x-c.x)<(p.w+c.w)/2&&p.y-p.h<c.y+c.h+6&&p.y>c.y){
    if(c.st==='fall'){if(G.fx&&G.fx.pepper>0){p.x=c.x+sgn(p.x-c.x||1)*((p.w+c.w)/2+1);continue}if(p.ground&&!G.demo){die('crush');return}hurt();p.vx=sgn(p.x-c.x||1)*220;continue}
    if(c.st==='rest'&&p.y<=c.y+4&&p.vy>=0){p.y=c.y;p.vy=0;p.ground=true;continue}   // you can stand on a crusher while it rests (not while it rises back to the ceiling)
    p.x=c.x+sgn(p.x-c.x||1)*((p.w+c.w)/2+.5);p.vx=0}
  // checkpoint and goal
  if(!G.demo&&!G.cpHit&&p.x>=L.cp*T){G.cpHit=true;sfx.item();floatText(L.cp*T+T/2,L.goalY*T-90,'Checkpoint','#9ff0ff')}
  if(p.x>=L.goal*T+T/2-6){if(G.demo){loadDemo();return}startGoal()}}
function standingOnPlank(){const p=PL,cy=Math.floor(p.y/T);let plank=false;for(const cx of [Math.floor((p.x-p.w/2+1)/T),Math.floor((p.x+p.w/2-1)/T)]){const v=tile(cx,cy);if(isSolid(v))return false;if(v===6)plank=true}return plank}
// the beacon: grab the pole, slide down, walk to the gate; higher grabs score more
function startGoal(){const p=PL,top=(L.goalY-9)*T,h=clamp((L.goalY*T-p.y)/(9*T),0,1),pts=h>.9?5000:h>.65?2000:h>.4?800:h>.2?400:100;
  p.st='goal';p.vx=0;p.vy=0;p.x=L.goal*T+T/2-8;p.face=1;G.phase='goal';G.pt=0;G.flagY=top;G.goalPts=pts;addScore(pts,p.x,p.y-40);sfx.flag()}
function updateGoal(dt){const p=PL,gy=L.goalY*T;G.pt+=dt;
  if(G.flagY<gy-40)G.flagY=Math.min(gy-40,G.flagY+260*dt);
  if(p.y<gy){p.y=Math.min(gy,p.y+220*dt);return}
  if(G.pt<.9)return;
  if(p.x<(L.goal+6)*T){p.x+=120*dt;p.anim+=dt*6;p.face=1;return}
  // count the time into the score
  if(G.time>0){const k=Math.min(G.time,Math.max(1,Math.ceil(dt*120)));G.time-=k;addScore(k*20);G.tk=(G.tk||0)+dt;if(G.tk>.05){G.tk=0;sfx.tick()}return}
  if(!G.clearT){G.clearT=G.pt;sfx.clear();setMsg('Level clear',1.8,`${G.coins} coins this run`)}
  if(G.pt-G.clearT>2){G.n++;P.bestLevel=Math.max(P.bestLevel,G.n);save();loadLevel(false);G.clearT=0}}

/* ---------- Update ---------- */
function update(dt){
  updateFx(dt);
  if(!L)return;
  for(const m of MP){const ox=m.x;m.x+=m.dir*m.sp*dt;if(m.x>m.x1){m.x=m.x1;m.dir=-1}if(m.x<m.x0){m.x=m.x0;m.dir=1}m.dx=m.x-ox}
  for(const [k,v] of BUMP){const nv=v-dt;if(nv<=0)BUMP.delete(k);else BUMP.set(k,nv)}
  if(G.demo){if(PL.x>(G.dmx||0)+16){G.dmx=PL.x;G.dmt=0}else if((G.dmt=(G.dmt||0)+dt)>8){loadDemo();return}   // attract mode: restart if the pilot stops making progress
    updatePlayer(dt);if(PL.st==='dead'){G.pt+=dt;if(G.pt>1.6||PL.y>WH+200)loadDemo()}updateEnemies(dt);updateCrushers(dt);updateProjectiles(dt);updatePickups(dt);updateCam(dt);return}
  if(G.phase==='dying'){G.pt+=dt;updatePlayer(dt);if(G.pt>2.4)loseLife();return}
  if(G.phase==='run'){
    for(const k in G.fx)G.fx[k]=Math.max(0,G.fx[k]-dt);
    G.tick=(G.tick||0)+dt;if(G.tick>=1){G.tick-=1;G.time--;if(G.time===60&&!G.hurry){G.hurry=true;sfx.hurry();setMsg('Hurry',1.6,'60 seconds left',true)}if(G.time<=0){G.time=0;die('time');return}}}
  updatePlayer(dt);updateEnemies(dt);updateCrushers(dt);updateProjectiles(dt);updatePickups(dt);updateCam(dt)}
function updateCam(dt){const p=PL,tx=clamp(p.x-VIEWW*.38+p.face*30,0,Math.max(0,L.w*T-VIEWW));camX+=(tx-camX)*Math.min(1,dt*6)}
function loseLife(){G.lives--;if(G.lives<0){gameOver();return}loadLevel(true)}
function updateFx(dt){
  coinPulse=Math.max(0,coinPulse-dt*4);
  if(CHEAT&&G.owned&&!G.demo){G.ammo.wand=Math.max(G.ammo.wand,99);G.ammo.bomb=Math.max(G.ammo.bomb,99);G.ammo.laser=Math.max(G.ammo.laser,999);G.fuel=FUEL_MAX}
  if(G.wpnT>0)G.wpnT-=dt;if(G.heartFlash>0)G.heartFlash-=dt;if(G.lockT&&(G.lockT[1]-=dt)<=0)G.lockT=null;
  for(const c of FLY){c.t+=dt;if(c.t>=c.dur){c.done=1;coinPulse=1;sfx.tick()}}FLY=FLY.filter(c=>!c.done);
  for(const f of FX){f.life-=dt;if(f.k==='gp'){f.x+=f.vx*dt;f.y+=f.vy*dt;f.vy+=300*dt;f.vx*=.96}if(f.k==='bit'){f.x+=f.vx*dt;f.y+=f.vy*dt;f.vy+=1400*dt}if(f.k==='coinpop'){f.y+=f.vy*dt;f.vy+=1400*dt}}FX=FX.filter(f=>f.life>0);
  for(const f of FLOAT){f.y-=34*dt;f.life-=dt}FLOAT=FLOAT.filter(f=>f.life>0);
  if(msg){msg.life-=dt;if(msg.life<=0)msg=null}
  shake=Math.max(0,shake-dt*24)}

/* ---------- Game over, Workshop, inventory ---------- */
function gameOver(){G.state='over';showPlayUI(false);
  const newBest=G.score>(G.prevBest||0)&&G.score>0;P.best=Math.max(P.best,G.score);P.bestLevel=Math.max(P.bestLevel,G.n);P.bank+=G.coins;save();
  showOv(`<div class="eyebrow">Run over · World ${lvlName(G.n)}</div><h2>${newBest?'New best score!':'Out of lives'}</h2>
    <div class="stats"><span>Score <b class="gold">${G.score.toLocaleString()}</b></span><span>Reached <b>${lvlName(G.n)}</b></span><span>Coins banked <b class="gold">${G.coins}</b></span></div>
    <div class="stats"><span>Best <b>${P.best.toLocaleString()}</b></span><span>Furthest <b>${lvlName(P.bestLevel)}</b></span><span>Bank <b class="gold">${P.bank}</b></span></div>
    <div class="acts"><button class="btn" type="button" data-act="go">Play again</button><button class="btn ghost" type="button" data-act="ws">Workshop</button><button class="btn ghost" type="button" data-act="menu" data-back>Menu</button><button class="btn ghost" type="button" data-act="arc">Back to Arcade</button></div>`,
    {go:()=>startRun(),ws:()=>workshop(),menu:()=>titleScreen(),arc:()=>{location.href=ARCADE_URL}},'bad')}
function workshop(){G={state:'shop',demo:true,n:0,fx:{}};if(!L)loadDemo();
  const UIC={hearts:'heart',boots:'boot',bag:'lock',sling:'gears',pouch:'fire',kit:'wrench'};
  const card=u=>{const l=lv(u.id),c=u.cost[l];return`<div class="card"><h3>${iconCanvas('u',UIC[u.id])}${u.name}</h3><div class="pips">${'●'.repeat(l)}${'○'.repeat(3-l)}</div><div class="d">${u.desc[l]}${l<3?` → <b style="color:var(--paper)">${u.desc[l+1]}</b>`:''}</div>
    <button class="btn sm" type="button" data-act="up" data-u="${u.id}" ${l>=3||P.bank<c?'disabled':''}>${l>=3?'Maxed':`Buy · ${c} coins`}</button></div>`};
  showOv(`<div class="hbar"><div><div class="eyebrow">Workshop</div><h2><span class="cash">${P.bank}</span> coins banked</h2></div>
    <div class="acts" style="margin:0"><button class="btn" type="button" data-act="go">Start run</button><button class="btn ghost" type="button" data-act="back" data-back>Back</button></div></div>
    <div class="grid">${UPG.map(card).join('')}</div>`,
    {up:b=>{const u=UPG.find(x=>x.id===b.dataset.u),l=lv(u.id);if(l>=3||P.bank<u.cost[l])return;P.bank-=u.cost[l];P.up[u.id]=l+1;save();sfx.buy();workshop();
      const nb=ovIn.querySelector(`[data-u="${u.id}"]`);if(pad.active)(nb&&!nb.disabled?nb:ovIn.querySelector('.btn')).focus()},

    {const hw=Math.min(VW*.6,400*s),hh=12*s;uiPic(ctx,'hazard',VW/2-hw/2,my-30*s-hh,hw,hh);uiPic(ctx,'hazard',VW/2-hw/2,my+(msg.sub?48:24)*s,hw,hh);if(msg.warn)uiPic(ctx,'warn',VW/2-hw/2-46*s,my-20*s,40*s)}
    txt(msg.t.toUpperCase(),VW/2,my,(msg.warn?34:40)*s,msg.warn?'#ff4f2a':'#ffb03a','center');if(msg.sub)txt(msg.sub.toUpperCase(),VW/2,my+34*s,16*s,'#fff','center');ctx.globalAlpha=1}
  if(HUDR.coin)for(const c of FLY){const k=clamp(c.t/c.dur,0,1),e=k*k*(3-2*k),tx=HUDR.coin[0],ty=HUDR.coin[1],mx=(c.sx+tx)/2,my=Math.min(c.sy,ty)-120*s;
    const px=(1-e)*(1-e)*c.sx+2*(1-e)*e*mx+e*e*tx,py=(1-e)*(1-e)*c.sy+2*(1-e)*e*my+e*e*ty,r=(11-4*k)*s,sp=Math.abs(Math.cos(c.spin+c.t*14));
    ctx.globalCompositeOperation='lighter';const g=ctx.createRadialGradient(px,py,1,px,py,r*2.6);g.addColorStop(0,'rgba(255,220,110,.75)');g.addColorStop(1,'rgba(255,160,40,0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(px,py,r*2.6,0,TAU);ctx.fill();
    ctx.globalCompositeOperation='source-over';if(anm(ctx,'coin'+(Math.floor(c.spin+c.t*16)%4),px,py,r*2)||itm(ctx,sp>.72?'c0':sp>.36?'c1':'c2',px,py,r*2.1))continue;ctx.fillStyle='#7a5214';ctx.beginPath();ctx.ellipse(px,py,r*sp+1,r,0,0,TAU);ctx.fill();ctx.fillStyle='#f2c24a';ctx.beginPath();ctx.ellipse(px,py,(r-1.5)*sp+.5,r-1.5,0,0,TAU);ctx.fill();
    ctx.fillStyle='rgba(255,250,220,.9)';ctx.fillRect(px-r*.3*sp,py-r*.55,1.5*s,r*.7)}
  if(G.phase==='dying'&&PL&&PL.why==='time'&&G.pt>.3)txt('OUT OF TIME',VW/2,VH*.36,36*s,'#ff4f7b','center');
  ctx.textBaseline='alphabetic'}
function drawSplashArt(){// key art: the logo over the frozen scene (rendered for splash.jpg)
  ctx.setTransform(DPR,0,0,DPR,0,0);const g=ctx.createLinearGradient(0,0,VW*.6,0);g.addColorStop(0,'rgba(14,12,10,.55)');g.addColorStop(1,'rgba(14,12,10,0)');ctx.fillStyle=g;ctx.fillRect(0,0,VW,VH);
  const s=VH/1072;ctx.save();ctx.translate(110*s,400*s);ctx.font=`400 ${300*s}px "Black Ops One","Arial Black",sans-serif`;ctx.textBaseline='alphabetic';ctx.textAlign='left';
  const word='JUMP!';ctx.shadowColor='rgba(255,106,26,.7)';ctx.shadowBlur=40*s;ctx.lineJoin='round';ctx.lineWidth=18*s;ctx.strokeStyle='#2a120a';ctx.strokeText(word,0,14*s);ctx.strokeText(word,0,0);ctx.shadowBlur=0;
  const gr=ctx.createLinearGradient(0,-240*s,0,10*s);gr.addColorStop(0,'#f3eee6');gr.addColorStop(.4,'#bdb4aa');gr.addColorStop(.52,'#857a70');gr.addColorStop(.8,'#a9562a');gr.addColorStop(1,'#ff7a2a');ctx.fillStyle=gr;ctx.fillText(word,0,0);ctx.restore();
  ctx.font=`600 ${40*s}px Oswald,Arial`;ctx.fillStyle='#f1e9df';ctx.strokeStyle='#1a0d06';ctx.lineWidth=8*s;ctx.lineJoin='round';ctx.textAlign='left';ctx.letterSpacing='6px';ctx.strokeText('A JENISAN ARCADE GAME',122*s,490*s);ctx.fillText('A JENISAN ARCADE GAME',122*s,490*s)}
function draw(){ctx.setTransform(1,0,0,1,0,0);if(!L){ctx.fillStyle='#141530';ctx.fillRect(0,0,cv.width,cv.height);return}
  if(SHOT)t=1.2;drawSky();drawWorld();if(!G.demo&&(G.state==='play'||G.state==='paused'||G.state==='inv'))drawHUD();if(SHOT)drawSplashArt()}

/* ---------- Layout + loop ---------- */
let PORTRAIT=false;   // phones and tablets play in landscape only: frame() re-checks every frame and blocks play while portrait
function resize(){DPR=Math.min(2,devicePixelRatio||1);VW=innerWidth;VH=innerHeight;cv.width=Math.round(VW*DPR);cv.height=Math.round(VH*DPR);
  SC=Math.min(VH/WH,VW/420);VIEWW=VW/SC;OY=(VH-WH*SC)/2;if(SHOT){SC=VH/360;VIEWW=VW/SC;OY=VH-13.4*T*SC}layoutPads();
  const portrait=PORTRAIT=COARSE&&VH>VW;$('rotate').hidden=!portrait;if(portrait&&(G.state==='play'||G.state==='inv')){if(G.state==='inv')closeInv();pause(true)}}
addEventListener('resize',resize);
function goFull(){if(!COARSE||document.fullscreenElement)return;const el=document.documentElement,rq=el.requestFullscreen||el.webkitRequestFullscreen;
  try{const p=rq&&rq.call(el,{navigationUI:'hide'});p&&p.then&&p.then(()=>screen.orientation&&screen.orientation.lock&&screen.orientation.lock('landscape').catch(()=>{})).catch(()=>{})}catch(e){}}
function frame(now){const dt=Math.min(.033,(now-last)/1000);last=now;if((COARSE&&innerHeight>innerWidth)!==PORTRAIT)resize();if(PORTRAIT&&G.state==='play')pause(true);pollPad(dt);
  t+=dt;if(G.state==='play'||G.state==='title')update(dt);
  sfx.music(musicLevel());draw();requestAnimationFrame(frame)}
try{document.fonts.load('400 24px "Black Ops One"');document.fonts.load('700 16px Oswald');document.fonts.load('400 24px "Lilita One"');document.fonts.load('900 16px Nunito')}catch(e){}
resize();titleScreen();requestAnimationFrame(frame);
